{% load static %}
<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <base href="/">
  <title>{{ texts.login_title }}</title>
  <link rel="stylesheet" href="{% static 'wedding/css/board.css' %}">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>{{ texts.login_title }}</h1>
    <p>{{ texts.login_prompt }}</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'wedding:login' %}">
      {% csrf_token %}
      <label for="passphrase">{{ texts.passphrase }}</label>
      <input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required autofocus>
      <button class="button primary" type="submit">{{ texts.login }}</button>
    </form>
  </main>
</body>
</html>
